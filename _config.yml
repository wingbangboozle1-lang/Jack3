# GitHub Pages builds this branch with Jekyll. The published site is ONLY the
# curated dashboard below; the repository's research layers and source code are
# kept for audit and must not be served.
#
# Published from the repository root:
#   index.html, economy.html, demographics.html, geography.html, schools.html,
#   tenant.html, risk.html, taxes.html, decisions.html, model.html,
#   review.html, sources.html, assets/style.css, assets/app.js
#
# scripts/stage_pages.py verifies the exact file set, and CI builds with Jekyll
# and compares the output byte for byte, so a mistake in this list fails the
# build instead of silently publishing source files or dropping a stylesheet.
exclude:
  # repository documents
  - COORDINATION.md
  - EXECUTIVE_SUMMARY.md
  - README.md
  - REPO_REVIEW.md
  - VERIFY.md
  - Gemfile
  - Gemfile.lock
  # research layers and code produced by earlier sessions (audit trail only)
  - _advisory_src
  - _dashboard_src
  - _pages_artifact
  - _jekyll_test
  - advisory
  - analysis
  - audit
  - brief
  - dashboard
  - dashboard_src
  - data
  - decision-file
  - docs
  - model
  - pages
  - report
  - research
  - scripts
  - site
  - tools
  - verification-3644edd8
  - build_site.py
