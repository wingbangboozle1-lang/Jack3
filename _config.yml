# GitHub Pages uses Jekyll on the main branch. Keep unverified companion reports
# in the repository, but exclude them and all research/source code from the site.
exclude:
  - COORDINATION.md
  - EXECUTIVE_SUMMARY.md
  - README.md
  - REPO_REVIEW.md
  - VERIFY.md
  - analysis
  - advisory
  - audit
  - brief
  - data
  - decision-file
  - dashboard
  - docs
  - model/
  - pages
  - research
  - scripts
  - site
  - tools
  - build_site.py
  - assets/app.js
