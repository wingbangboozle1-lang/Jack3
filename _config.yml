# GitHub Pages uses Jekyll with the repository root as its source on `main`.
#
# Only the curated artifact produced by scripts/stage_pages.py is published:
# index.html, the eighteen category pages, and assets/style.css. Everything
# else in this repository is research, other sessions' audit layers, or
# generators, and is deliberately kept off the public site.
#
# The pages themselves are generated from data by _site_src/build.py, and the
# `_site_src` directory is underscore-prefixed so Jekyll ignores it natively.
exclude:
  - COORDINATION.md
  - EXECUTIVE_SUMMARY.md
  - README.md
  - REPO_REVIEW.md
  - VERIFY.md
  - _advisory_src
  - _dashboard_src
  - _pages_artifact
  - _site_src
  - advisory
  - analysis
  - audit
  - brief
  - build_site.py
  - dashboard
  - data
  - decision-file
  - docs
  - model
  - pages
  - research
  - scripts
  - site
  - tools
