# GitHub Pages (legacy Jekyll build from main:/).
# One canonical site is published: the root *.html pages plus assets/style.css.
# Every other top-level file and directory is audit trail, source code or a
# repository-only companion layer and MUST NOT be published.
theme: null
defaults:
  - scope:
      path: ""
    values:
      layout: null
exclude:
  # root documents and tooling
  - .github
  - .gitignore
  - _config.yml
  - COORDINATION.md
  - EXECUTIVE_SUMMARY.md
  - README.md
  - REPO_REVIEW.md
  - VERIFY.md
  - build_site.py
  - assets/app.js
  # generated / scratch
  - _pages_artifact
  - _jekyll_test
  - __pycache__
  - "*.py"
  - "*.pyc"
  - "*.md"
  - "*.json"
  - "*.txt"
  # source and companion layers
  - _advisory_src
  - _dashboard_src
  - advisory
  - analysis
  - audit
  - brief
  - dashboard
  - data
  - decision-file
  - dashboard
  - docs
  - model
  - pages
  - research
  - scripts
  - site
  - tools
