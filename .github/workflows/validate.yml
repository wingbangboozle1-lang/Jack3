name: Validate public research
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Root evidence workspace (deterministic build + provenance)
        run: |
          python scripts/build.py
          python scripts/validate.py
      - name: Canonical decision file (build, link/source/privacy/determinism gate)
        run: |
          python3 tools/build_report.py
          python3 tools/check_report.py
      - name: No generator output is stale
        run: git diff --exit-code -- '*.html' 'report/assets/*.css'
