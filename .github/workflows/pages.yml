name: Deploy curated Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py && python scripts/validate.py && git diff --exit-code -- '*.html'
      - run: python scripts/stage_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_artifact
      - id: deployment
        uses: actions/deploy-pages@v4
