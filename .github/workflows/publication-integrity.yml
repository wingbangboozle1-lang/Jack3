name: Public artifact regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_publication.py -v
